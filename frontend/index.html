    <!-- Limpeza de emergência de caches corrompidos e desregistro de Service Workers -->
    <script>
      try {
        if ('caches' in window) {
          caches.keys().then(function(names) {
            names.forEach(function(name) {
              caches.delete(name);
            });
          });
        }
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var r of regs) {
              r.unregister();
            }
          });
        }
      } catch (e) {
        console.warn('Erro ao limpar caches:', e);
      }
    </script>
    <!-- Previne erros do React Fast Refresh em compilações locais -->
    <script>
      if (!window.$RefreshReg$) window.$RefreshReg$ = () => {};
      if (!window.$RefreshSig$) window.$RefreshSig$ = () => (type) => type;

    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #070A10;
        color: #ffffff;
      }
      .boot-splash {
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at 50% 35%, rgba(249, 115, 22, 0.14) 0%, #070A10 65%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
      }
      .boot-logo {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        font-size: 1.35rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        color: #ffffff;
      }
      .boot-flame-wrap {
        position: relative;
        width: 78px;
        height: 78px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .boot-flame-wrap::before {
        content: '';
        position: absolute;
        inset: -14%;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(249, 115, 22, 0.42) 0%, transparent 72%);
        filter: blur(10px);
        animation: bootHalo 1.5s ease-in-out infinite alternate;
      }
      .boot-flame-img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        mix-blend-mode: screen;
        transform-origin: center bottom;
        animation: bootFlame 1.35s ease-in-out infinite alternate;
        position: relative;
        z-index: 2;
      }
      @keyframes bootFlame {
        0% { transform: translateY(2px) scale(0.96, 0.98) rotate(-1.5deg); }
        100% { transform: translateY(-2px) scale(1.03, 1.06) rotate(1.2deg); }
      }
      @keyframes bootHalo {
        0% { transform: scale(0.88); opacity: 0.65; }
        100% { transform: scale(1.15); opacity: 1; }
      }
      .boot-dot {
        width: 34px;
        height: 4px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
        overflow: hidden;
        position: relative;
      }
      .boot-dot::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 50%;
        background: #f97316;
        border-radius: 999px;
        animation: bootSlide 1s ease-in-out infinite alternate;
      }
      @keyframes bootSlide {
        from { transform: translateX(-20%); }
        to { transform: translateX(120%); }
      }
    </style>

    <script>
      // Garante que nenhum Service Worker antigo permaneça ativo na aba

            reg.unregister();
